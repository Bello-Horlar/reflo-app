name: Build REFLO Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Brand Icon
        run: |
          curl -s -L -o www/Reflo-icon-512.png https://reflohdc.netlify.app/assets/images/Reflo-icon-512.png

      - name: Install Dependencies
        run: npm install

      - name: Initialize Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Kill Capacitor Native Splash Screen (Force Black)
        run: |
          STYLES="android/app/src/main/res/values/styles.xml"
          if [ -f "$STYLES" ]; then
            sed -i 's|<item name="android:background">@drawable/splash</item>|<item name="android:background">#000000</item>|g' "$STYLES"
          fi
          for dir in android/app/src/main/res/drawable*; do
            rm -f "$dir/splash.png"
          done

      - name: Inject REFLO Brand Icon (Clean & No Duplicates)
        run: |
          # Copy icon into density folders only (avoids XML conflict)
          for dir in android/app/src/main/res/mipmap-*dpi; do
            cp www/Reflo-icon-512.png "$dir/ic_launcher.png"
            cp www/Reflo-icon-512.png "$dir/ic_launcher_round.png"
            cp www/Reflo-icon-512.png "$dir/ic_launcher_foreground.png"
          done

          # Clean anydpi-v26
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.png

          # Set adaptive icon background color to black
          COLOR_FILE="android/app/src/main/res/values/ic_launcher_background.xml"
          if [ -f "$COLOR_FILE" ]; then
            sed -i 's/<color name="ic_launcher_background">.*<\/color>/<color name="ic_launcher_background">#000000<\/color>/g' "$COLOR_FILE"
          fi

      - name: Configure Android Permissions
        run: |
          MANIFEST="android/app/src/main/Manifest.xml"
          [ -f "$MANIFEST" ] || MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          sed -i '/<application/i \
          <uses-permission android:name="android.permission.INTERNET" /> \
          <uses-permission android:name="android.permission.VIBRATE" /> \
          <uses-permission android:name="android.permission.CAMERA" /> \
          <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" /> \
          <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" /> \
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"

      - name: Grant Gradle Permissions
        run: |
          cd android
          chmod +x gradlew

      - name: Compile APK and Google Play AAB Bundle
        run: |
          cd android
          ./gradlew assembleDebug
          ./gradlew bundleDebug

      - name: Upload APK (For your phone)
        uses: actions/upload-artifact@v4
        with:
          name: REFLO-APK-Installable
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB (For Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: REFLO-AAB-GooglePlay
          path: android/app/build/outputs/bundle/debug/app-debug.aab
