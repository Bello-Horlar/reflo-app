<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REFLO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; }
        
        html, body {
            width: 100vw;
            height: 100vh;
            background: #000000;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .splash-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 85px 20px 45px;
            box-sizing: border-box;
        }

        .center-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .logo-wrapper {
            position: relative;
            width: 105px;
            height: 105px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pulse-halo {
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(37,99,235,0.75) 0%, rgba(0,0,0,0) 75%);
            animation: splashGlowPulse 1.5s infinite ease-in-out;
        }

        .app-icon {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .dots-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 10px;
        }

        .splash-dot {
            width: 8px;
            height: 8px;
            background: #2563eb;
            border-radius: 50%;
            animation: splashDotBounce 0.85s infinite alternate ease-in-out;
        }

        .footer-box {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .brand-name {
            font-size: 1.4rem;
            font-weight: 900;
            color: #2563eb;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .brand-sub {
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            letter-spacing: 0.5px;
        }

        @keyframes splashGlowPulse {
            0%, 100% { transform: scale(0.9); opacity: 0.4; }
            50% { transform: scale(1.25); opacity: 0.95; }
        }

        @keyframes splashDotBounce {
            from { opacity: 0.25; transform: translateY(0); }
            to { opacity: 1; transform: translateY(-7px); }
        }
    </style>
</head>
<body>

    <div class="splash-container">
        <!-- Top Spacer -->
        <div style="width: 100%; height: 20px;"></div>

        <!-- Center Animated Logo & Dots -->
        <div class="center-box">
            <div class="logo-wrapper">
                <div class="pulse-halo"></div>
                <img src="Reflo-icon-512.png" alt="REFLO" class="app-icon">
            </div>

            <div class="dots-row">
                <div class="splash-dot" style="animation-delay: 0s;"></div>
                <div class="splash-dot" style="animation-delay: 0.2s;"></div>
                <div class="splash-dot" style="animation-delay: 0.4s;"></div>
            </div>
        </div>

        <!-- Branding Footer Tag -->
        <div class="footer-box">
            <span class="brand-name">REFLO</span>
            <span class="brand-sub">powered by <strong style="color: #cbd5e1;">HDC</strong></span>
        </div>
    </div>

    <!-- 🟢 INSTANT LOCAL RUNTIME SCRIPT -->
    <script>
        const LIVE_APP_URL = "https://reflohdc.netlify.app";

        // Show the pulsing halo and bouncing dots for 3.5 seconds, then launch live app
        setTimeout(() => {
            if (!navigator.onLine) {
                window.location.replace("offline.html");
            } else {
                window.location.replace(LIVE_APP_URL);
            }
        }, 3500);
    </script>
</body>
  </html>
